name: Build VPN Swither APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir project
          unzip -q VPN_Swither_GitHub_Actions.zip -d project

      - name: Find Gradle project
        run: |
          echo "Ищем gradlew..."
          find project -name gradlew -type f

      - name: Make gradlew executable
        run: |
          chmod +x $(find project -name gradlew -type f | head -1)

      - name: Build APK
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPN-Swither-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
