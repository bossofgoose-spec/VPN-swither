name: Build VPN Swither APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q VPN_Swither_GitHub_Actions.zip -d project

      - name: Find project
        run: |
          echo "=== Project files ==="
          find project -maxdepth 5 -type f | sort

          echo "=== Gradle wrapper ==="
          find project -name gradlew -type f

      - name: Fix JVM target
        run: |
          echo "=== Fixing Java/Kotlin JVM settings ==="

          find project -type f -name "*.gradle" -exec sed -i \
            's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' {} +

          find project -type f -name "*.gradle" -exec sed -i \
            's/JavaVersion\.VERSION_8/JavaVersion.VERSION_17/g' {} +

          find project -type f -name "*.gradle" -exec sed -i \
            's/sourceCompatibility[[:space:]]*=[[:space:]]*1\.8/sourceCompatibility = 17/g' {} +

          find project -type f -name "*.gradle" -exec sed -i \
            's/targetCompatibility[[:space:]]*=[[:space:]]*1\.8/targetCompatibility = 17/g' {} +

          find project -type f -name "*.gradle" -exec sed -i \
            's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' {} +

          find project -type f -name "*.gradle" -exec sed -i \
            's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']8["'\'']/jvmTarget = "17"/g' {} +

          echo "=== Remaining Java 8 references ==="
          grep -RIn "VERSION_1_8\|VERSION_8\|jvmTarget.*1.8\|sourceCompatibility.*1.8\|targetCompatibility.*1.8" project || true

      - name: Make Gradle executable
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found!"
            exit 1
          fi

          chmod +x "$GRADLEW"
          echo "Gradle wrapper: $GRADLEW"

      - name: Build APK
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)
          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Building project from:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          echo "=== APK files ==="
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPN-Swither-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
