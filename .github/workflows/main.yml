name: Build VPN Swither APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q VPN_Swither_GitHub_Actions.zip -d project

      - name: Find Gradle wrapper
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          chmod +x "$GRADLEW"
          echo "Found: $GRADLEW"

      - name: Create Android Java/Kotlin compatibility fix
        run: |
          cat > jvm-fix.gradle <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.configureEach { task ->
                  if (task.name.toLowerCase().contains("kotlin")) {
                      try {
                          task.kotlinOptions.jvmTarget = "17"
                      } catch (Exception ignored) {
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)
          PROJECT_DIR=$(dirname "$GRADLEW")

          cd "$PROJECT_DIR"

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --init-script "$GITHUB_WORKSPACE/jvm-fix.gradle"

      - name: Find APK
        run: |
          echo "=== APK FILES ==="
          find "$GITHUB_WORKSPACE/project" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPN-Swither-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
